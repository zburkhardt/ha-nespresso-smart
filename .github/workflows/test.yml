name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install ruff

      - name: Lint
        run: ruff check custom_components tools tests

      - name: Format check
        run: ruff format --check custom_components tools tests

  test:
    name: Home Assistant 2026.10 and BLE unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install minimum-version test dependencies
        run: >-
          python -m pip install pytest homeassistant==2026.10.0
          bleak==3.0.2 bleak-retry-connector==4.7.1 bluetooth-adapters==2.4.0
          habluetooth==7.1.2 aiousbwatcher==1.1.2 serialx==1.11.0 aiohasupervisor==0.6.0

      - name: Run tests
        run: python -m pytest -q
